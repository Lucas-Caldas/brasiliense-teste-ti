spring:
  application:
    name: brasiliense-teste-ti

  # Por padrão sobe com H2 pra facilitar demonstração local.
  # Pra SQL Server, use o profile: --spring.profiles.active=sqlserver
  datasource:
    url: jdbc:h2:mem:brasiliense;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  ranking:
    procedure-call: "SELECT * FROM sp_ranking_condominio(:inicio, :termino)"

---
spring:
  config:
    activate:
      on-profile: sqlserver

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=BrasilienseTeste;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: SuaSenhaAqui

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlserver.sql
      data-locations: classpath:data.sql

# SQL Server
app:
  ranking:
    procedure-call: "EXEC dbo.sp_ranking_condominio @dt_inicio = :inicio, @dt_termino = :termino"
